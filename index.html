<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>勤務実施表アプリ</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a;padding:16px}.wrap{max-width:1200px;margin:auto}.card{background:#fff;border-radius:18px;box-shadow:0 1px 6px #0001;padding:18px;margin-bottom:16px}h1{margin:0;font-size:28px}.sub{color:#64748b;margin:6px 0}.saved{color:#047857;font-size:13px}button,.fileLabel{border:1px solid #cbd5e1;border-radius:14px;background:#fff;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer;margin:4px}button.primary{background:#0f172a;color:#fff;border-color:#0f172a}.fileLabel input{display:none}.grid{display:grid;gap:12px}.topgrid{grid-template-columns:repeat(4,1fr)}label span{display:block;color:#64748b;font-size:12px;font-weight:700;margin-bottom:4px}input,select{width:100%;height:38px;border:1px solid #cbd5e1;border-radius:10px;padding:6px 8px;font-size:15px;background:white}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat .big{font-size:28px;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.mobileList{display:grid;gap:14px}.day{border:1px solid #e2e8f0;border-radius:18px;padding:14px;background:#fff}.sat{background:#eff6ff}.hol{background:#fff1f2}.dayhead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;margin-bottom:10px}.calc{background:#ffffffaa;border-radius:12px;padding:10px;font-size:14px}table{border-collapse:collapse;width:100%;min-width:1100px;font-size:13px}th,td{border-bottom:1px solid #e2e8f0;padding:6px;text-align:left}th{background:#f1f5f9}.scroll{overflow:auto}.excel table{min-width:1000px}.excel td,.excel th{border:1px solid #94a3b8}.note{font-size:13px;color:#475569;line-height:1.7}@media(max-width:700px){body{padding:10px}.topgrid,.stats{grid-template-columns:1fr}h1{font-size:24px}.desktopOnly{display:none}.card{padding:14px}}</style></head><body><div class="wrap"><header class="card"><h1>勤務実施表アプリ</h1><p class="sub">スマホ入力 → 入力データ出力 → PCで読込 → Excel出力</p><p class="saved" id="saved">自動保存済み：未保存</p><div><button class="primary" onclick="downloadExcel()">Excel出力</button><button onclick="downloadTransferData()">入力データ出力</button><label class="fileLabel">入力データ読込<input type="file" accept=".json,application/json" onchange="importTransferData(event)"></label><button onclick="downloadCsv()">CSV出力</button><button onclick="window.print()">印刷</button><button onclick="copyNextMonth()">翌月へコピー</button><button onclick="clearSaved()">保存データ削除</button></div></header><section class="card tabs"><button id="tabMobile" class="primary" onclick="setView('mobile')">スマホ入力画面</button><button id="tabTable" onclick="setView('table')">一覧表画面</button><button id="tabExcel" onclick="setView('excel')">Excel様式確認</button></section><section class="card"><div class="grid topgrid"><label><span>年</span><input id="year" type="number" onchange="changeMonth(false)"></label><label><span>月</span><select id="month" onchange="changeMonth(false)"></select></label><label><span>社員NO.</span><input id="employeeNo" oninput="saveState();render()"></label><label><span>氏名</span><input id="employeeName" oninput="saveState();render()"></label></div></section><section class="stats"><div class="card stat"><div class="sub">時間数計</div><div class="big" id="actualTotal">0.00 h</div><div class="sub" id="timeDetail"></div></div><div class="card stat"><div class="sub">日数・交通費</div><div class="big" id="daysTotal">0 日</div><div class="sub" id="dayDetail"></div></div></section><section id="viewMobile" class="mobileList"></section><section id="viewTable" class="card hidden"><div class="scroll"><table id="tableView"></table></div></section><section id="viewExcel" class="card hidden excel"><div class="scroll"><table id="excelView"></table></div></section><section class="card note"><b>使い方</b><br>スマホで入力後「入力データ出力」を押してJSONファイルを保存し、メール・LINE WORKS等でPCへ送ります。PC側でこの画面を開き「入力データ読込」を押してJSONを選び、その後「Excel出力」を押します。</section></div><script>
const weekNames=["日","月","火","水","木","金","土"];const holidays2026={"2026-01-01":"元日","2026-01-12":"成人の日","2026-02-11":"建国記念の日","2026-02-23":"天皇誕生日","2026-03-20":"春分の日","2026-04-29":"昭和の日","2026-05-03":"憲法記念日","2026-05-04":"みどりの日","2026-05-05":"こどもの日","2026-05-06":"休日","2026-07-20":"海の日","2026-08-11":"山の日","2026-09-21":"敬老の日","2026-09-22":"休日","2026-09-23":"秋分の日","2026-10-12":"スポーツの日","2026-11-03":"文化の日","2026-11-23":"勤労感謝の日"};const workTypes=["通常","有休","有給","公休","欠勤"];const breakOptions=["","0","0.5","1","1.5","2","2.5","3","3.5","4"];const timeOptions=["",...Array.from({length:48},(_,i)=>`${String(Math.floor(i/2)).padStart(2,"0")}:${i%2===0?"00":"30"}`)];const STORAGE_KEY="work-report-app-v3";let state={year:2026,month:1,employeeNo:"18",employeeName:"相原孝人",rows:makeRows(2026,1)};let view="mobile";function pad(n){return String(n).padStart(2,"0")}function toNumber(v){const n=Number(v);return Number.isFinite(n)?n:0}function toMin(t){if(!t||!t.includes(":"))return null;const[h,m]=t.split(":").map(Number);return h*60+m}function hoursBetween(s,e){const sm=toMin(s);let em=toMin(e);if(sm===null||em===null)return 0;if(em<sm)em+=1440;return(em-sm)/60}function nightHours(s,e,nb){const sm=toMin(s);let em=toMin(e);if(sm===null||em===null)return 0;if(em<sm)em+=1440;let total=0;[[0,300],[1320,1740]].forEach(([a,b])=>{const os=Math.max(sm,a),oe=Math.min(em,b);if(oe>os)total+=oe-os});return Math.max(0,total/60-toNumber(nb))}function calcRow(r){if(r.workType==="有休"||r.workType==="有給")return{actual:7,overtime:0,night:0};if(r.workType==="公休"||r.workType==="欠勤"||!r.start||!r.end)return{actual:0,overtime:0,night:0};const actual=Math.max(0,hoursBetween(r.start,r.end)-toNumber(r.breakBefore22)-toNumber(r.breakAfter22));return{actual,overtime:Math.max(0,actual-8),night:nightHours(r.start,r.end,r.breakAfter22)}}function makeRows(y,m){const last=new Date(y,m,0).getDate();return Array.from({length:last},(_,i)=>{const d=i+1,dt=new Date(y,m-1,d),key=`${y}-${pad(m)}-${pad(d)}`;return{id:key,date:d,week:weekNames[dt.getDay()],holiday:holidays2026[key]||"",transport:"",vehicle:false,site:"",workType:"通常",start:"",end:"",breakBefore22:"",breakAfter22:"",memo:""}})}function copyRowsToMonth(rows,y,m){return makeRows(y,m).map((t,i)=>{const s=rows[i];return s?{...t,transport:s.transport||"",vehicle:!!s.vehicle,site:s.site||"",workType:s.workType||"通常",start:s.start||"",end:s.end||"",breakBefore22:s.breakBefore22||"",breakAfter22:s.breakAfter22||"",memo:s.memo||""}:t})}function saveState(){state.year=Number(document.getElementById("year").value)||2026;state.month=Number(document.getElementById("month").value)||1;state.employeeNo=document.getElementById("employeeNo").value;state.employeeName=document.getElementById("employeeName").value;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));document.getElementById("saved").textContent="自動保存済み："+new Date().toLocaleTimeString("ja-JP")}function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(s&&Array.isArray(s.rows))state=s}catch(e){}}function changeMonth(copy){const y=Number(document.getElementById("year").value)||2026,m=Number(document.getElementById("month").value)||1;state.rows=copy?copyRowsToMonth(state.rows,y,m):makeRows(y,m);state.year=y;state.month=m;saveState();render()}function copyNextMonth(){let y=state.year,m=state.month+1;if(m>12){m=1;y++}state.year=y;state.month=m;state.rows=copyRowsToMonth(state.rows,y,m);render();saveState()}function clearSaved(){if(confirm("保存データを削除しますか？")){localStorage.removeItem(STORAGE_KEY);state={year:2026,month:1,employeeNo:"",employeeName:"",rows:makeRows(2026,1)};render();}}function setView(v){view=v;["mobile","table","excel"].forEach(x=>{document.getElementById("view"+cap(x)).classList.toggle("hidden",x!==v);document.getElementById("tab"+cap(x)).classList.toggle("primary",x===v)})}function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}function options(arr,val){return arr.map(x=>`<option value="${x}" ${x==val?"selected":""}>${x===""?"選択":x+(arr===breakOptions&&x!==""?"h":"")}</option>`).join("")}function update(i,k,v){state.rows[i][k]=v;saveState();render()}function totals(){return state.rows.reduce((a,r)=>{const c=calcRow(r),off=["公休","欠勤","有休","有給"].includes(r.workType);a.actual+=c.actual;a.overtime+=c.overtime;a.night+=c.night;a.transport+=toNumber(r.transport);a.paid+=["有休","有給"].includes(r.workType)?1:0;a.publicOff+=r.workType==="公休"?1:0;a.absent+=r.workType==="欠勤"?1:0;a.workingDays+=!off&&(r.site||r.start||r.end)?1:0;return a},{actual:0,overtime:0,night:0,transport:0,paid:0,publicOff:0,absent:0,workingDays:0})}function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function exportRows(){return state.rows.map(r=>{const c=calcRow(r);return[`${state.year}/${state.month}/${r.date}`,r.week,r.holiday,r.transport,r.vehicle?"会社車":"",r.site,r.workType,r.start,r.end,r.breakBefore22,r.breakAfter22,c.actual.toFixed(2),c.overtime.toFixed(2),c.night.toFixed(2),r.memo]})}const header=["日付","曜日","祝日","交通費","車両","現場名","区分","始業","終業","22時以前休憩","22時以降深夜休憩","実働","残業","深夜","メモ"];function download(name,content,type){const b=new Blob(["\uFEFF"+content],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}function downloadCsv(){const csv=[header,...exportRows()].map(line=>line.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");download(`勤務実施表_${state.year}_${pad(state.month)}_${state.employeeName||"未入力"}.csv`,csv,"text/csv;charset=utf-8")}function downloadExcel(){const t=totals();const summary=[["社員NO.",state.employeeNo,"氏名",state.employeeName,"対象年月",`${state.year}年${state.month}月`],["稼働日数",t.workingDays,"有給日数",t.paid,"公休日数",t.publicOff,"欠勤日数",t.absent],["時間数計",t.actual.toFixed(2),"残業",t.overtime.toFixed(2),"深夜",t.night.toFixed(2),"交通費",t.transport]];const html=`<html><head><meta charset="UTF-8"></head><body><table border="1"><tr><th colspan="15" style="font-size:18px;background:#e5e7eb;">勤務実施表</th></tr>${summary.map(l=>`<tr>${l.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}<tr>${header.map(h=>`<th style="background:#dbeafe;">${esc(h)}</th>`).join("")}</tr>${exportRows().map(l=>`<tr>${l.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></body></html>`;download(`勤務実施表_${state.year}_${pad(state.month)}_${state.employeeName||"未入力"}.xls`,html,"application/vnd.ms-excel;charset=utf-8")}function downloadTransferData(){download(`勤務実施表_入力データ_${state.year}_${pad(state.month)}_${state.employeeName||"未入力"}.json`,JSON.stringify(state,null,2),"application/json;charset=utf-8")}function importTransferData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(String(r.result).replace(/^\uFEFF/,""));if(!Array.isArray(d.rows))throw new Error();state=d;view="table";render();saveState();alert("読み込みました")}catch{alert("読み込みに失敗しました")}};r.readAsText(f,"utf-8");e.target.value=""}function renderMobile(){document.getElementById("viewMobile").innerHTML=state.rows.map((r,i)=>{const c=calcRow(r),cls=r.week==="日"||r.holiday?"hol":r.week==="土"?"sat":"";return`<div class="day ${cls}"><div class="dayhead"><div>${r.date}日（${r.week}）</div><div>${r.holiday}</div></div><div class="grid"><label><span>区分</span><select onchange="update(${i},'workType',this.value)">${workTypes.map(x=>`<option ${x===r.workType?"selected":""}>${x}</option>`).join("")}</select></label><label><span>現場名</span><input value="${esc(r.site)}" oninput="update(${i},'site',this.value)"></label><div class="grid" style="grid-template-columns:1fr 1fr"><label><span>始業</span><select onchange="update(${i},'start',this.value)">${options(timeOptions,r.start)}</select></label><label><span>終業</span><select onchange="update(${i},'end',this.value)">${options(timeOptions,r.end)}</select></label></div><div class="grid" style="grid-template-columns:1fr 1fr"><label><span>22時以前休憩</span><select onchange="update(${i},'breakBefore22',this.value)">${options(breakOptions,r.breakBefore22)}</select></label><label><span>22時以降休憩</span><select onchange="update(${i},'breakAfter22',this.value)">${options(breakOptions,r.breakAfter22)}</select></label></div><div class="grid" style="grid-template-columns:1fr 1fr"><label><span>交通費</span><input type="number" value="${esc(r.transport)}" oninput="update(${i},'transport',this.value)"></label><label style="margin-top:22px"><input type="checkbox" ${r.vehicle?"checked":""} onchange="update(${i},'vehicle',this.checked)"> 車両あり</label></div><label><span>備考</span><input value="${esc(r.memo)}" oninput="update(${i},'memo',this.value)"></label><div class="calc">実働 <b>${c.actual.toFixed(2)}h</b>　残業 ${c.overtime.toFixed(2)}h　深夜 ${c.night.toFixed(2)}h</div></div></div>`}).join("")}function renderTable(){document.getElementById("tableView").innerHTML=`<thead><tr>${["日","曜","祝日",...header.slice(3)].map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${state.rows.map((r,i)=>{const c=calcRow(r);return`<tr><td>${r.date}</td><td>${r.week}</td><td>${r.holiday}</td><td><input type="number" value="${esc(r.transport)}" oninput="update(${i},'transport',this.value)"></td><td><input type="checkbox" ${r.vehicle?"checked":""} onchange="update(${i},'vehicle',this.checked)"></td><td><input value="${esc(r.site)}" oninput="update(${i},'site',this.value)"></td><td><select onchange="update(${i},'workType',this.value)">${workTypes.map(x=>`<option ${x===r.workType?"selected":""}>${x}</option>`).join("")}</select></td><td><select onchange="update(${i},'start',this.value)">${options(timeOptions,r.start)}</select></td><td><select onchange="update(${i},'end',this.value)">${options(timeOptions,r.end)}</select></td><td><select onchange="update(${i},'breakBefore22',this.value)">${options(breakOptions,r.breakBefore22)}</select></td><td><select onchange="update(${i},'breakAfter22',this.value)">${options(breakOptions,r.breakAfter22)}</select></td><td>${c.actual.toFixed(2)}</td><td>${c.overtime.toFixed(2)}</td><td>${c.night.toFixed(2)}</td><td><input value="${esc(r.memo)}" oninput="update(${i},'memo',this.value)"></td></tr>`}).join("")}</tbody>`}function renderExcel(){const t=totals();document.getElementById("excelView").innerHTML=`<tbody><tr><td colspan="15" style="background:#e2e8f0;text-align:center;font-size:18px;font-weight:bold">勤務実施表</td></tr><tr><td>社員NO.</td><td>${esc(state.employeeNo)}</td><td>氏名</td><td>${esc(state.employeeName)}</td><td>対象年月</td><td>${state.year}年${state.month}月</td><td colspan="9"></td></tr><tr>${header.map(h=>`<td style="background:#dbeafe;font-weight:bold">${h}</td>`).join("")}</tr>${exportRows().map(l=>`<tr>${l.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}<tr><td colspan="15" style="background:#f1f5f9;font-weight:bold">集計</td></tr><tr><td>稼働日数</td><td>${t.workingDays}</td><td>有給日数</td><td>${t.paid}</td><td>公休日数</td><td>${t.publicOff}</td><td>欠勤日数</td><td>${t.absent}</td><td>時間数計</td><td>${t.actual.toFixed(2)}</td><td>残業</td><td>${t.overtime.toFixed(2)}</td><td>深夜</td><td>${t.night.toFixed(2)}</td><td>交通費 ${t.transport}</td></tr></tbody>`}function render(){document.getElementById("year").value=state.year;document.getElementById("month").innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1==state.month?"selected":""}>${i+1}月</option>`).join("");document.getElementById("employeeNo").value=state.employeeNo;document.getElementById("employeeName").value=state.employeeName;const t=totals();document.getElementById("actualTotal").textContent=t.actual.toFixed(2)+" h";document.getElementById("timeDetail").textContent=`残業 ${t.overtime.toFixed(2)}h / 深夜 ${t.night.toFixed(2)}h`;document.getElementById("daysTotal").textContent=t.workingDays+" 日";document.getElementById("dayDetail").textContent=`有給 ${t.paid}日 / 公休 ${t.publicOff}日 / 欠勤 ${t.absent}日 / 交通費 ${t.transport.toLocaleString()}円`;renderMobile();renderTable();renderExcel();setView(view)}loadState();render();saveState();
</script></body></html>
